<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Mis recuerdos</title>


<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at center,
            #3d3d3d 0%,
            #171717 50%,
            #050505 100%
        );

    overflow-x: hidden;
}


/* =====================================================
   TITULO
===================================================== */

header {

    text-align: center;

    padding:
        35px 20px 10px;
}

header h1 {

    margin: 0;

    font-size:
        clamp(32px, 5vw, 55px);

    letter-spacing: 2px;

    text-shadow:
        0 5px 25px rgba(0,0,0,.7);
}

header p {

    margin-top: 10px;

    color: #bdbdbd;

    font-size: 16px;
}


/* =====================================================
   ESCENA
===================================================== */

.escena {

    width: 100%;

    height: 570px;

    display: flex;

    justify-content: center;

    align-items: center;

    perspective: 1500px;

    overflow: hidden;
}


/* =====================================================
   CARRUSEL
===================================================== */

.carrusel {

    width: 220px;

    height: 330px;

    position: relative;

    transform-style: preserve-3d;

    transition:
        transform 1s
        cubic-bezier(.2,.8,.2,1);
}


/* =====================================================
   MINIATURAS
===================================================== */

.foto {

    position: absolute;

    width: 180px;

    height: 260px;

    left: 20px;

    top: 35px;

    border-radius: 14px;

    overflow: hidden;

    border:
        4px solid
        rgba(255,255,255,.95);

    background: #222;

    cursor: pointer;

    /*
       Importante:

       NO deformamos las fotos.
       La imagen mantiene sus proporciones.
    */

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.65);

    transition:
        box-shadow .3s,
        filter .3s;
}


/* =====================================================
   IMAGEN
===================================================== */

.foto img {

    width: 100%;

    height: 100%;

    display: block;

    /*
       Mantiene las proporciones
       de la imagen.
    */

    object-fit: cover;

    transition:
        transform .5s;
}


/* =====================================================
   EFECTO AL PASAR EL MOUSE
===================================================== */

.foto:hover {

    box-shadow:
        0 0 25px
        rgba(255,255,255,.35),

        0 20px 50px
        rgba(0,0,0,.8);

    filter:
        brightness(1.08);
}

.foto:hover img {

    transform:
        scale(1.05);
}


/* =====================================================
   NUMERO
===================================================== */

.numero {

    position: absolute;

    top: 10px;

    left: 10px;

    width: 30px;

    height: 30px;

    display: flex;

    justify-content: center;

    align-items: center;

    border-radius: 50%;

    background:
        rgba(0,0,0,.7);

    backdrop-filter:
        blur(6px);

    font-weight: bold;

    z-index: 2;
}


/* =====================================================
   POSICIONES
===================================================== */

/*
   8 fotografías

   360° / 8 = 45°

   IMPORTANTE:

   translateZ = 300px

   Antes estaba en 400px.
   Ahora están más cerca.
*/

.foto1 {

    transform:
        rotateY(0deg)
        translateZ(300px);
}

.foto2 {

    transform:
        rotateY(45deg)
        translateZ(300px);
}

.foto3 {

    transform:
        rotateY(90deg)
        translateZ(300px);
}

.foto4 {

    transform:
        rotateY(135deg)
        translateZ(300px);
}

.foto5 {

    transform:
        rotateY(180deg)
        translateZ(300px);
}

.foto6 {

    transform:
        rotateY(225deg)
        translateZ(300px);
}

.foto7 {

    transform:
        rotateY(270deg)
        translateZ(300px);
}

.foto8 {

    transform:
        rotateY(315deg)
        translateZ(300px);
}


/* =====================================================
   CONTROLES
===================================================== */

.controles {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 15px;

    margin-top: -5px;
}

button {

    border: none;

    padding:
        13px 25px;

    border-radius: 30px;

    background: white;

    color: #111;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    transition:
        transform .25s,
        background .25s;
}

button:hover {

    transform:
        scale(1.07);

    background:
        #eeeeee;
}


/* =====================================================
   INDICADOR
===================================================== */

.instruccion {

    text-align: center;

    margin-top: 18px;

    color: #888;

    font-size: 14px;
}


/* =====================================================
   VENTANA DE TEXTO
===================================================== */

.overlay {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

    background:
        rgba(0,0,0,.8);

    backdrop-filter:
        blur(10px);

    opacity: 0;

    visibility: hidden;

    transition:
        opacity .4s,
        visibility .4s;
}

.overlay.activa {

    opacity: 1;

    visibility: visible;
}


/* =====================================================
   CARTA
===================================================== */

.carta {

    position: relative;

    width:
        min(600px, 95vw);

    padding: 40px;

    border-radius: 20px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #ededed
        );

    color: #222;

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.75);

    transform:
        translateY(40px)
        scale(.9);

    transition:
        transform .5s
        cubic-bezier(.2,.8,.2,1);
}

.overlay.activa .carta {

    transform:
        translateY(0)
        scale(1);
}


.carta h2 {

    margin:
        0 40px 15px 0;

    font-size: 30px;
}

.carta p {

    margin: 0;

    font-size: 17px;

    line-height: 1.7;

    color: #444;
}


/* =====================================================
   BOTON CERRAR
===================================================== */

.cerrar {

    position: absolute;

    top: 15px;

    right: 15px;

    width: 40px;

    height: 40px;

    padding: 0;

    border-radius: 50%;

    background: #222;

    color: white;

    font-size: 22px;
}

.cerrar:hover {

    background: #555;

    transform:
        rotate(90deg);
}


/* =====================================================
   MOVIL
===================================================== */

@media (max-width: 700px) {

    .escena {

        height: 480px;

        perspective:
            1000px;
    }

    .carrusel {

        transform:
            scale(.72);
    }

    .carta {

        padding: 30px 25px;
    }
}


/* =====================================================
   ANIMACION DE ENTRADA
===================================================== */

@keyframes aparecer {

    from {

        opacity: 0;

        transform:
            translateY(25px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}

header,
.escena {

    animation:
        aparecer 1s ease;
}

</style>

</head>


<body>


<!-- =====================================================
     TITULO
===================================================== -->

<header>

    <h1>
        FELIZ CUMPLEAÑOS ❤️
    </h1>

    <p>
        Los recuerdos mas importantes
        Que influyeron en tu vida
    </p>

</header>


<!-- =====================================================
     CARRUSEL
===================================================== -->

<div class="escena">

    <div
        class="carrusel"
        id="carrusel"
    >


        <!-- FOTO 1 -->

        <div
            class="foto foto1"
            onclick="seleccionarFoto(0)"
        >

            <img
                img src="Fotos Recuerdos/Foto 1.jpg"
                alt="Foto 1"
            >

            <div class="numero">
                1
            </div>

        </div>


        <!-- FOTO 2 -->

        <div
            class="foto foto2"
            onclick="seleccionarFoto(1)"
        >

            <img
                src="Fotos Recuerdos/Foto 2.jpg"
                alt="Foto 2"
            >

            <div class="numero">
                2
            </div>

        </div>


        <!-- FOTO 3 -->

        <div
            class="foto foto3"
            onclick="seleccionarFoto(2)"
        >

            <img
                src="Fotos Recuerdos/Foto 3.jpg"
                alt="Foto 3"
            >

            <div class="numero">
                3
            </div>

        </div>


        <!-- FOTO 4 -->

        <div
            class="foto foto4"
            onclick="seleccionarFoto(3)"
        >

            <img
                src="Fotos Recuerdos/Foto 4.jpg"
                alt="Foto 4"
            >

            <div class="numero">
                4
            </div>

        </div>


        <!-- FOTO 5 -->

        <div
            class="foto foto5"
            onclick="seleccionarFoto(4)"
        >

            <img
                src="Fotos Recuerdos/Foto 5.jpg"
                alt="Foto 5"
            >

            <div class="numero">
                5
            </div>

        </div>


        <!-- FOTO 6 -->

        <div
            class="foto foto6"
            onclick="seleccionarFoto(5)"
        >

            <img
                src="Fotos Recuerdos/Foto 6.jpg"
                alt="Foto 6"
            >

            <div class="numero">
                6
            </div>

        </div>


        <!-- FOTO 7 -->

        <div
            class="foto foto7"
            onclick="seleccionarFoto(6)"
        >

            <img
                src="Fotos Recuerdos/Foto 7.jpg"
                alt="Foto 7"
            >

            <div class="numero">
                7
            </div>

        </div>


        <!-- FOTO 8 -->

        <div
            class="foto foto8"
            onclick="seleccionarFoto(7)"
        >

            <img
                src="Fotos Recuerdos/Foto 8.jpg"
                alt="Foto 8"
            >

            <div class="numero">
                8
            </div>

        </div>


    </div>

</div>


<!-- =====================================================
     BOTONES
===================================================== -->

<div class="controles">

    <button onclick="anterior()">

        ← Anterior

    </button>


    <button onclick="siguiente()">

        Siguiente →

    </button>

</div>


<div class="instruccion">

    Foto
    <strong id="numeroActual">
        1
    </strong>
    de 8

</div>


<!-- =====================================================
     VENTANA
===================================================== -->

<div
    class="overlay"
    id="overlay"
    onclick="cerrarVentana(event)"
>

    <div class="carta">

        <button
            class="cerrar"
            onclick="cerrarVentana()"
        >
            ×
        </button>


        <h2 id="titulo">
            Título
        </h2>


        <p id="texto">
            Texto
        </p>

    </div>

</div>


<script>

/* =====================================================
   INFORMACIÓN
===================================================== */

const recuerdos = [

    {
        titulo:
            "Primer momento: BRUNITO ❤️",

        texto:
            "Este fue el primer momento importante en tu vida del que fui parte e impacto a la Mafecita de hoy, la peridida de un amorcito."
    },

    {
        titulo:
            "EL DIA QUE LO CAMBIO TODO PARA AMBOS ✨",

        texto:
            "Creo que fue el dia que definio la vida de ambos, ya que ese dia yo decidi que no importaba que pasara, haria hasta lo imposible para estar contigo."
    },

    {
        titulo:
            "TU GRADUACION 🎓",

        texto:
            "El dia que cumpliste tu sueño y el de tu familia, por fin una abogada hecha y derecha despues de tanto esfuerzo y sacrificio."
    },

    {
        titulo:
            "LA PRIMERA DESPEDIDA 🚚",

        texto:
            "Cuando te mudaste a Bogota por primera vez y todo lucia incierto, no sabias que iba a ser de tu vida, pero conseguiste trabajo y tu tarjeta profesional."
    },

    {
        titulo:
            "EL REGRESO Y LA SEGUNDA DESPEDIDA 💫",

        texto:
            "Habias vuelto a Pereira, con un aire de nueva esperanza, la cual llego cuando entraste al consurso de la DIAN Y ganaste (obviamente), y tuviste que regresar a Bogota."
    },

    {
        titulo:
            "UNA FAMILIA UNIDA OTRA VEZ 😄",

        texto:
            "Cuando tus padres decidieron volver a darse una segunda oportunidad y todos se unieron en una sola familia y religion nuevamente."
    },

    {
        titulo:
            "UN SUEÑO DE ALTURA 🪂",

        texto:
            "Cuando cumpliste tu sueño de surcar los cielos y ser libre como un gorrion entre las nubes."
    },

    {
        titulo:
            "EL ADIOS ❤️",

        texto:
            "La ultima vez que nos vimos antes de decir adios para siempre y empezar un nuevo capitulo en nuestras vidas."
    }

];


/* =====================================================
   ELEMENTOS
===================================================== */

const carrusel =
    document.getElementById(
        "carrusel"
    );

const overlay =
    document.getElementById(
        "overlay"
    );

const titulo =
    document.getElementById(
        "titulo"
    );

const texto =
    document.getElementById(
        "texto"
    );

const numeroActual =
    document.getElementById(
        "numeroActual"
    );


/* =====================================================
   ESTADO
===================================================== */

/*
   IMPORTANTE:

   Esta variable representa
   exactamente qué fotografía
   estamos viendo.

   0 = foto 1
   1 = foto 2
   ...
   7 = foto 8
*/

let fotoActual = 0;


/* =====================================================
   ACTUALIZAR CARRUSEL
===================================================== */

function actualizarCarrusel() {

    /*
       Cada fotografía está separada
       45 grados.

       Multiplicamos la posición
       actual por -45 para llevarla
       hacia el frente.
    */

    const grados =
        fotoActual * -45;

    carrusel.style.transform =
        `rotateY(${grados}deg)`;


    /*
       Actualizamos el contador.
    */

    numeroActual.textContent =
        fotoActual + 1;
}


/* =====================================================
   SIGUIENTE
===================================================== */

function siguiente() {

    /*
       Avanzamos UNA sola posición.
    */

    fotoActual++;


    /*
       Después de la 8
       volvemos a la 1.
    */

    if (fotoActual >= 8) {

        fotoActual = 0;
    }


    actualizarCarrusel();
}


/* =====================================================
   ANTERIOR
===================================================== */

function anterior() {

    /*
       Retrocedemos UNA posición.
    */

    fotoActual--;


    /*
       Si estamos en la primera
       volvemos a la octava.
    */

    if (fotoActual < 0) {

        fotoActual = 7;
    }


    actualizarCarrusel();
}


/* =====================================================
   SELECCIONAR FOTO
===================================================== */

function seleccionarFoto(numero) {

    /*
       La foto pulsada se convierte
       en la foto actual.
    */

    fotoActual = numero;

    actualizarCarrusel();


    /*
       Mostramos su información.
    */

    titulo.textContent =
        recuerdos[numero].titulo;

    texto.textContent =
        recuerdos[numero].texto;


    /*
       Esperamos un poco para que
       se vea el giro antes de abrir
       la historia.
    */

    setTimeout(
        function() {

            overlay.classList.add(
                "activa"
            );

        },
        650
    );
}


/* =====================================================
   CERRAR VENTANA
===================================================== */

function cerrarVentana(event) {

    /*
       Si hacemos clic dentro de la
       carta no hacemos nada.
    */

    if (
        event &&
        event.target !== overlay
    ) {

        return;
    }

    overlay.classList.remove(
        "activa"
    );
}


/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "ArrowRight"
        ) {

            siguiente();
        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            anterior();
        }


        if (
            event.key ===
            "Escape"
        ) {

            overlay.classList.remove(
                "activa"
            );
        }

    }
);


/* =====================================================
   INICIO
===================================================== */

actualizarCarrusel();

</script>

</body>

</html>
